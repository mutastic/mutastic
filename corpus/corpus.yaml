# The corpus: real projects mutastic runs on every night, and before every release
# (.github/workflows/corpus.yml, scripts/corpus-run.sh). The samples show one feature each; these
# hold the combinations people write, where the bugs that matter turned up (a loop's slots read
# twice, a test helper in another package, a Maven wrapper older than 3.9.6).
#
# One project a line:
#   name     what the results call it, unique: letters, digits, _, . or -
#   git      the repository, quoted
#   commit   the full commit it runs at: a pin, never a branch or tag, so a night that fails is
#            mutastic's change, not the project's
#   dir      the build's directory, relative to the clone
#   module   the module to run, as `mutastic run` takes it (:core); none for the build's root
#   args     more for `mutastic run`, such as --tests-from=:other; none usually
#   test     the project's own test command, when the one worked out isn't right (a Kotlin
#            multiplatform build has jvmTest, not test); none usually
#   jdk      the JDK the build runs on (JAVA_HOME): 17, 21 or 25. mutastic itself runs on 25
#   shard    N for --shard=1/N: a share of about 30 to 60 mutants (64 is the most N can be)
#   shapes   what it covers that the others don't
#   expect   score: a run that ends with its reports and a score, and an intact agent head;
#            refused:<code>, when refusing it is right today: it passes when that code comes back;
#            known:<bug>, when a known mutastic bug stops it today, with the code it fails with in
#            fails: it passes while it fails that way, and fails the night once it scores
#            ("now passes, update expect"), so a fix moves it to score
#   fails    for known:<bug>, the code it fails with today
#   note     why, for a refusal or a known bug
#
# To add a project:
# 1. Pick it for a shape the others don't cover, and say which in shapes.
# 2. Pin a commit, the whole hash.
# 3. Set shard so a share is 30 to 60 mutants (`mutastic mutants <dir>` counts them, on its last
#    line), and the job fits in its time.
# 4. Set expect, and a note for anything but score.
# Then run the workflow on your branch with only: <name>.
#
# The known bugs are the Java corpus survey's (24 Nov 2026, mutastic 1.3.0; A1 is fixed in 1.3.1):
#   A2  a Maven wrapper below 3.9.6 reads as no Java code
#   A3  Maven runs without -ea, so tests of assert fail
#   A4  renamed test classes (X__mN) break tests that reach a test class in another package
#   A5  production classes aren't on the app class loader, so Java serialization can't find them
#   A6  Gradle 7: the injected setup reads test.javaLauncher, which has no value there
#   A7a Gradle 8 builds that don't declare junit-platform-launcher: the worker doesn't start
#   A7b a JDK 8 or 11 test toolchain is reported as an internal error, not refused
#   A8  a test engine that can't start (TestNG below 6.14.3, JUnit 3 or 4 alone) reads as
#       System.exit
# and those its first run found (24 Nov 2026, on GitHub's runners):
#   A11 a multi-release jar's classes (META-INF/versions/N) aren't loaded, so tests that reach
#       them fail
#   A12 a Kotlin mutant that doesn't verify stops the run with an internal error
# A failure here becomes a fixture or sample in the pull request that fixes it. Docker is off in
# the jobs, so no project here needs it to pass.
