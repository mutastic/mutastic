[versions]
junit = "6.1.3"
# The oldest JUnit Platform the worker compiles against: it runs on the project's own launcher,
# which for JUnit 5 projects is 1.x.
junit-platform-floor = "1.12.2"
assertj = "3.27.7"
archunit = "1.4.1"
# The oldest Maven the extension compiles against: it runs inside the project's own Maven.
maven = "3.9.9"
# The Maven plugin's annotations, read at build time into its descriptor.
maven-plugin-annotations = "3.15.2"
# Runs TestNG tests on the JUnit Platform, for a project whose tests are TestNG's.
testng-engine = "1.1.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-platform-launcher-floor = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-floor" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testng-engine = { module = "org.junit.support:testng-engine", version.ref = "testng-engine" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "maven" }
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "maven" }
maven-plugin-annotations = { module = "org.apache.maven.plugin-tools:maven-plugin-annotations", version.ref = "maven-plugin-annotations" }
