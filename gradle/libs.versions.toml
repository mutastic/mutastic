[versions]
junit = "6.1.3"
# The oldest JUnit Platform the worker compiles against: it runs on the project's own launcher,
# which for JUnit 5 projects is 1.x.
junit-platform-floor = "1.12.2"
assertj = "3.27.7"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-platform-launcher-floor = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-floor" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
