# mutastic on its own modules, every night: the tool's tests held to what it asks of everyone
# else's. The threshold is a floor under today's scores (engine 55.4%, report 62.9% on 4 Nov 2026,
# after the cards' truth check; api 54.0% on 3 Nov), raised as tests are added, so a real
# drop fails the run. The api is used, and
# tested, in the other modules, so their tests count for it (--tests-from); for the engine, the
# CLI's end-to-end tests would too, but run whole Gradle builds per mutant, so not nightly yet.
#
# The engine's run is most of the time (21 of 25 minutes on 9 Nov 2026), so it runs in four jobs,
# a share of its mutants each (`--shard=N/4`, dealt by id), beside the report's and the api's, each
# one share of one. A share's score is no measure of the module's, so the shares run with no
# threshold, and the last job puts each module's shares back together (`--from-shards`), as the
# whole run, with the module's floor as its threshold.
#
# Each night adds a row to score-history.tsv, kept in the Actions cache and attached to the run.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One share of one module's mutants each: the module's floor is checked after, on the whole. Each
  # share keeps what putting it back together needs in its own folder, uploaded as it is.
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: mutastic-engine, share: 1, of: 4 }
          - { module: mutastic-engine, share: 2, of: 4 }
          - { module: mutastic-engine, share: 3, of: 4 }
          - { module: mutastic-engine, share: 4, of: 4 }
          - { module: mutastic-report, share: 1, of: 1 }
          - module: mutastic-api
            share: 1
            of: 1
            args: --tests-from=:mutastic-engine --tests-from=:mutastic-report
    name: ${{ matrix.module }} ${{ matrix.share }}/${{ matrix.of }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew :mutastic-cli:installDist
      # Last night's run record of this share, so tonight's says what changed since.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/mutastic/${{ matrix.module }}/last-run.tsv
            build/mutastic/${{ matrix.module }}/last-runs/*.tsv
            build/mutastic/${{ matrix.module }}/shares/
          key: mutastic-share-${{ matrix.module }}-${{ matrix.share }}-of-${{ matrix.of }}-${{ github.run_id }}
          restore-keys: mutastic-share-${{ matrix.module }}-${{ matrix.share }}-of-${{ matrix.of }}-
      - name: mutastic run, on a share of the module
        run: |
          mutastic-cli/build/install/mutastic/bin/mutastic run ":${{ matrix.module }}" \
            --threshold=0 --shard=${{ matrix.share }}/${{ matrix.of }} ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: share-${{ matrix.module }}-${{ matrix.share }}-of-${{ matrix.of }}
          path: build/mutastic/${{ matrix.module }}/shares/${{ matrix.share }}-of-${{ matrix.of }}/

  # Each module's shares put back together as its whole run, with its floor as the threshold; the
  # whole run's record kept for the next night's to compare with, and the score history.
  floors:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew :mutastic-cli:installDist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: share-mutastic-engine-*
          path: shares/mutastic-engine
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: share-mutastic-report-*
          path: shares/mutastic-report
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: share-mutastic-api-*
          path: shares/mutastic-api
      # The last whole runs' records, which tonight's compare with, and the score history so far.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/mutastic/*/last-run.tsv
            build/mutastic/*/last-runs/*.tsv
            score-history.tsv
          key: mutastic-nightly-${{ github.run_id }}
          restore-keys: mutastic-nightly-
      - name: Each module's floor, on all its shares
        run: |
          failed=0
          floor() {
            mutastic-cli/build/install/mutastic/bin/mutastic run ":$1" --from-shards="shares/$1" \
              --threshold="$2" --format=jsonl > "$1.jsonl" || failed=1
            grep '"reason":"run-finished"' "$1.jsonl" \
              | python3 -c 'import json,sys; e=json.load(sys.stdin); print(sys.argv[1], e["mutants"], "mutants, score", e["score"], "against", e["threshold"], "passed" if e["passed"] else "FAILED")' "$1" \
              || true
          }
          floor mutastic-engine 53
          floor mutastic-report 60
          floor mutastic-api 50
          exit $failed
      - name: Score history
        if: always()
        run: |
          for name in mutastic-engine mutastic-report mutastic-api; do
            .github/score-row.py "$name.jsonl" score-history.tsv "$GITHUB_SHA" "$name" > summary.md
          done
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      # A share that failed or didn't finish fails the Nightly, whatever the floors say.
      - name: Every share finished
        if: always()
        run: test "${{ needs.run.result }}" = success
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutastic-report
          path: |
            mutastic-*.jsonl
            score-history.tsv
            build/mutastic/*/mutation.*
