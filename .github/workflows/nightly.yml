# mutastic on its own modules, every night: the tool's tests held to what it asks of everyone
# else's. The threshold is a floor under today's scores (engine 52.3%, report 55.7% on 1 Nov 2026),
# raised as tests are added, so a real drop fails the run. The api has its own row but no floor:
# its records are used, and tested, in the other modules. Only each module's own tests count: the
# CLI's end-to-end tests are in another module.
#
# Each night adds a row to score-history.tsv, kept in the Actions cache and attached to the run.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutastic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew :mutastic-cli:installDist
      # Last night's run records, so tonight's say what changed since, and the score history.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/mutastic/*/last-run.tsv
            score-history.tsv
          key: mutastic-nightly-${{ github.run_id }}
          restore-keys: mutastic-nightly-
      - name: mutastic run, on each module
        run: |
          failed=0
          for module in mutastic-engine:50 mutastic-report:50 mutastic-api:0; do
            name="${module%%:*}"
            mutastic-cli/build/install/mutastic/bin/mutastic run ":$name" \
              --format=jsonl --threshold="${module##*:}" > "$name.jsonl" || failed=1
          done
          exit $failed
      - name: Score history
        if: always()
        run: |
          for name in mutastic-engine mutastic-report mutastic-api; do
            .github/score-row.py "$name.jsonl" score-history.tsv "$GITHUB_SHA" "$name" > summary.md
          done
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutastic-report
          path: |
            mutastic-*.jsonl
            score-history.tsv
            build/mutastic/
