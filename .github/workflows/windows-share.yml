# One share of the CLI's end-to-end tests on Windows, run the way a Windows user runs them, with
# `gradlew.bat`. CI calls it for each share, and once more for a share whose runner broke under
# it (windows-faults.sh): the tests are the same, on a new machine.
name: Windows share

on:
  workflow_call:
    inputs:
      share:
        description: "Which share: 1, the cards and both build tools' samples; 2, the Gradle plugin, the gate and a Quarkus build."
        required: true
        type: number
      again:
        description: Whether this is the share's second run, after its runner broke.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    # A share takes 5 to 16 minutes. Past the tests' own limits (five minutes a test, 25 for the
    # step), so a test that hangs fails, says where, and its reports are kept, rather than the job
    # being cut off. A runner that stops answering doesn't keep to the step's limit, only to this
    # one, and then the share runs again: at 45 minutes that took an hour to find out.
    timeout-minutes: 30
    env:
      TESTS: >-
        ${{ inputs.share == 1
        && '--tests io.mutastic.cli.CardsTest --tests io.mutastic.cli.PricingSampleTest --tests io.mutastic.cli.MavenPluginTest'
        || '--tests io.mutastic.cli.GradlePluginTest --tests io.mutastic.cli.GateTest --tests io.mutastic.cli.QuarkusTest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The Maven samples' plugins and dependencies, as on Linux (the cli job). Only the first
      # share runs Maven.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: maven
        if: inputs.share == 1
        with:
          path: |
            ~/.m2/repository
            build/samples-maven-local
          key: maven-${{ runner.os }}-${{ inputs.share }}-${{ hashFiles('samples/**/pom.xml', '.github/maven-warm.sh') }}
          restore-keys: maven-${{ runner.os }}-${{ inputs.share }}-
      - if: inputs.share == 1
        shell: bash
        run: bash .github/maven-warm.sh
      # The tests start Gradle daemons (TestKit's) and apps (Quarkus) that can outlive them, so
      # this stops them before it ends, whatever the tests did, and keeps their exit code.
      #
      # Now and then, partway through, the runner can no longer start java.exe or node.exe: each
      # exits at once with 0xC0000142 (STATUS_DLL_INIT_FAILED) while cmd.exe still starts, and it
      # stays that way after every java process is stopped. Free memory and disk are normal. From
      # then on every mutastic run fails (CardsTest's cards come out empty, Gradle and Maven don't
      # start), and so does every step after this one, the reports' upload included, since actions
      # run on node. So this step prints what it can itself: whether Java still starts, the
      # failures in full (the test task logs them, CardsTest as a diff), and the runner's state
      # (windows-dump.ps1), on every share so a failure has a healthy share to compare with.
      - shell: pwsh
        timeout-minutes: 25
        run: |
          # A failing native command mustn't end the script: what follows has to run.
          $PSNativeCommandUseErrorActionPreference = $false
          Get-PSDrive C, D | Format-Table Name, @{n='FreeGB'; e={[math]::Round($_.Free / 1GB, 1)}}
          .\gradlew.bat :mutastic-cli:test ${{ env.TESTS }} --continue
          $tests = $LASTEXITCODE
          Get-PSDrive C, D | Format-Table Name, @{n='FreeGB'; e={[math]::Round($_.Free / 1GB, 1)}}
          & "$env:JAVA_HOME\bin\java.exe" -version 2>$null
          $state = 'baseline'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::This runner can no longer start java.exe (exit $LASTEXITCODE, 0xC0000142 is STATUS_DLL_INIT_FAILED): the failures above are the runner's, and the steps after this one can't run. Rerun the job."
            $state = 'failure'
          }
          try { & .\.github\windows-dump.ps1 $state } catch { Write-Host "The runner's state couldn't be dumped: $_" }
          .\gradlew.bat --stop
          Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          exit $tests
      # What was running when a test ran out of time, as on Linux.
      - name: what a test that timed out was waiting on
        if: always()
        shell: bash
        run: bash .github/timeout-dumps.sh
      - if: github.ref == 'refs/heads/main' && inputs.share == 1 && steps.maven.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf ~/.m2/repository/io/mutastic build/samples-maven-local/io/mutastic
          find ~/.m2/repository build/samples-maven-local \( -name '*.lastUpdated' -o -name 'resolver-status.properties' \) -delete || true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && inputs.share == 1 && steps.maven.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.m2/repository
            build/samples-maven-local
          key: ${{ steps.maven.outputs.cache-primary-key }}
      # Each share's reports and results, named apart, whether its tests passed or failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-windows-${{ inputs.share }}-${{ github.run_attempt }}${{ inputs.again && '-again' || '' }}
          path: |
            mutastic-cli/build/reports/
            mutastic-cli/build/test-results/
