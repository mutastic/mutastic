# The build on every push and pull request: format, Error Prone and NullAway, Checkstyle, the
# tests (on JDK 25 for the engine and JDK 17 for the worker), ArchUnit and the coverage floor.
# Actions are pinned to a commit: a tag can be moved.
#
# The CLI's end-to-end tests take most of the time, each running a sample's own build, so they run
# in parallel jobs, a share of the test classes each (`-Pmutastic.shard`), beside the rest of the
# build. The coverage floor is over every module's tests at once, so it's checked last, from what
# each job measured.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Everything but the CLI's end-to-end tests and the coverage floor.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The worker's tests run on 17, the oldest JDK mutastic supports; everything else on 25.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build cyclonedxBom -x :mutastic-cli:test -x coverageReport -x coverageCheck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-build
          path: "*/build/jacoco/test.exec"
      # The reports, kept when the build fails too: test results, Checkstyle, the SBOM.
      # Test reports are named for the attempt: a rerun can't replace an artifact, and a rerun's
      # reports are the ones wanted when it fails.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ github.run_attempt }}
          path: |
            build/reports/
            */build/reports/

  # The CLI's end-to-end tests, a quarter of the test classes each.
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew :mutastic-cli:test -Pmutastic.shard=${{ matrix.shard }}/4
      # These tests build a copy of a sample project, and each copy is a new directory, so Gradle
      # forks a javac worker for it rather than reusing the identical one it forked for the copy
      # before. A worker belongs to the daemon that forked it and outlives the build with it, for
      # the three hours a daemon waits by default: a full build left 118 of them idle, and a few
      # builds left hundreds, gigabytes of them, which starved everything else on the machine. The
      # samples' builds now share a daemon that goes twenty seconds after they stop using it
      # (mutastic-cli's build file), which takes its workers with it.
      #
      # A worker the samples left looks exactly like one this build forked for mutastic's own JDK
      # 17 modules, and the daemons that own them can stand in for each other, so neither the
      # command line nor the parent says whose a worker is. What the tests left is the difference
      # instead: the test task records how many were running as it began, with everything it
      # depends on built and no test started, and the rest is what the tests themselves left. That
      # is nothing once the samples' daemon has gone, whatever each shard had to compile, where
      # unbounded it is scores of them. Four is slack for a worker forked late.
      #
      # A daemon takes a moment to go and the samples' waits for its timeout, so the difference is
      # given a minute to settle. The pattern is written `Mai[n]`, and the processes filtered to
      # those running a JVM, so this step's own command line isn't counted as one of them.
      - name: the sample builds left nothing running
        if: always()
        run: |
          before=mutastic-cli/build/gradle-workers-before.txt
          if [ ! -f $before ]; then
            echo "The tests never started, so there is no count to compare. Nothing to say here."
            exit 0
          fi
          started=$(cat $before)
          for attempt in $(seq 1 13); do
            ps -eo pid=,ppid=,args= | grep 'bin/java' > processes.txt || true
            running=$(grep -c 'process\.internal\.worker\.GradleWorkerMai[n]' processes.txt || true)
            left=$((running - started))
            if [ "$left" -le 4 ]; then break; fi
            sleep 5
          done
          echo "Workers: $started when the tests began, $running now, so the tests left $left."
          if [ "$left" -gt 4 ]; then
            echo "The samples' builds left $left workers running a minute after the tests:"
            awk '/process\.internal\.worker\.GradleWorkerMai[n]/ { print "  " $1 " (daemon " $2 ")" }' processes.txt
            exit 1
          fi
          echo "The samples' builds left nothing running."
      # What the tests measured, in their JVM and outside it (the worker, Maven, Gradle).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cli-${{ matrix.shard }}
          path: mutastic-cli/build/jacoco/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-cli-${{ matrix.shard }}-${{ github.run_attempt }}
          path: mutastic-cli/build/reports/

  # Windows, on its own beside the others: the CLI's end-to-end tests on a few samples (the cards,
  # a Gradle build and a Maven build), run the way a Windows user runs them, with `gradlew.bat`.
  # The rest of the build is the same on every platform, so it runs on Linux only.
  # Windows, in two shares to stay under 30 minutes each: the cards and both build tools' samples,
  # then the Gradle plugin, the gate and a Quarkus build.
  windows-share:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - share: 1
            tests: --tests io.mutastic.cli.CardsTest --tests io.mutastic.cli.PricingSampleTest --tests io.mutastic.cli.MavenPluginTest
          - share: 2
            tests: --tests io.mutastic.cli.GradlePluginTest --tests io.mutastic.cli.GateTest --tests io.mutastic.cli.QuarkusTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The tests start Gradle daemons (TestKit's) and apps (Quarkus) that can outlive them. When a
      # test failed, the steps after this one, the reports' upload and every post step, failed at
      # once with nothing said, and Java processes were still running: so this stops them before
      # it ends, whatever the tests did, and keeps their exit code.
      - shell: pwsh
        run: |
          .\gradlew.bat :mutastic-cli:test ${{ matrix.tests }} --continue
          $tests = $LASTEXITCODE
          .\gradlew.bat --stop
          Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          exit $tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-windows-${{ matrix.share }}-${{ github.run_attempt }}
          path: mutastic-cli/build/reports/

  # The check branch protection names: passes when both Windows shares do.
  windows:
    needs: windows-share
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.windows-share.result }}" = success

  # The coverage floor, over what every job measured.
  coverage:
    needs: [build, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-cli-*
          path: shards
      # Each share's files, named apart, where the coverage tasks read the CLI's.
      - run: |
          outside=mutastic-cli/build/jacoco/outside
          mkdir -p "$outside"
          for shard in shards/*; do
            name=$(basename "$shard")
            cp "$shard/test.exec" "$outside/$name-test.exec"
            for file in "$shard"/outside/*.exec; do
              cp "$file" "$outside/$name-$(basename "$file")"
            done
          done
      - run: ./gradlew coverageReport coverageCheck -x test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-coverage-${{ github.run_attempt }}
          path: build/reports/
