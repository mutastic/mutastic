# The build on every push, pull request and merge queue entry: format, Error Prone and NullAway,
# Checkstyle, the tests (on JDK 25 for the engine and JDK 17 for the worker), ArchUnit and the
# coverage floor.
# Actions are pinned to a commit: a tag can be moved.
#
# The CLI's end-to-end tests take most of the time, each running a sample's own build, so they run
# in parallel jobs, a share of the test classes each (`-Pmutastic.shard`), beside the rest of the
# build. The coverage floor is over every module's tests at once, so it's checked last, from what
# each job measured.
#
# On a pull request that changes nothing the build reads (the repository's own Markdown pages, the
# changelog's entries, the issue and pull request templates, workflows other than this one, the
# hooks), the jobs that build and test are skipped, as `changes` decides: a skipped job counts as
# passed for branch protection, and the CLI's shards, whose checks are named for their share, run
# with nothing to do instead, since a matrix skipped whole reports one check under the job's bare
# name. docs/ is read by the build, so a change there runs everything. The merge queue, main and a
# run by hand always run everything: main is always fully tested.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue: each pull request merged with main and those ahead of it, before it lands.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's new push cancels the run for its last one, which no one will read. Every other
# run has a group of its own, so a run of the merge queue or main is never cancelled, nor kept
# waiting behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether to build and test: on a pull request, unless every file it changes is one the build
  # doesn't read; otherwise always. The list comes from the API, so nothing is checked out, and if
  # it can't be had in full, everything runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number }}
          COUNT: ${{ github.event.pull_request.changed_files }}
          # What the build never reads: the top-level Markdown pages, the changelog's entries and
          # script, the citation, the templates and picture under .github, the workflows other
          # than this one, and the hooks.
          UNREAD: '^([^/]+\.md|changes/.*|scripts/changelog\.sh|CITATION\.cff|\.github/(ISSUE_TEMPLATE/.*|PULL_REQUEST_TEMPLATE\.md|pip\.webp|workflows/(commits|docs|nightly|portal|release)\.yml)|\.githooks/.*)$'
        run: |
          code=true
          if [ "$EVENT" = pull_request ] &&
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" --jq '.[].filename' > files.txt &&
            [ "$(wc -l < files.txt)" -eq "$COUNT" ]; then
            if ! grep -qvE "$UNREAD" files.txt; then
              code=false
            fi
            echo "The pull request changes:"
            sed 's/^/  /' files.txt
          fi
          echo "Build and test: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Everything but the CLI's end-to-end tests and the coverage floor.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The worker's tests run on 17, the oldest JDK mutastic supports; everything else on 25.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build cyclonedxBom -x :mutastic-cli:test -x coverageReport -x coverageCheck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-build
          path: "*/build/jacoco/test.exec"
      # The reports, kept when the build fails too: test results, Checkstyle, the SBOM.
      # Test reports are named for the attempt: a rerun can't replace an artifact, and a rerun's
      # reports are the ones wanted when it fails.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ github.run_attempt }}
          path: |
            build/reports/
            */build/reports/

  # The CLI's end-to-end tests, a quarter of the test classes each.
  cli:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - if: needs.changes.outputs.code != 'true'
        run: echo "Nothing the build reads changed, so there is nothing to test."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: needs.changes.outputs.code == 'true'
      # The Maven samples' plugins and dependencies, fetched before the tests with tries again when
      # Central doesn't serve one (maven-warm.sh), and kept from main's last run, so most runs
      # fetch little. Saved below, once the tests pass on main.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: maven
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.m2/repository
            build/samples-maven-local
          key: maven-${{ runner.os }}-cli-${{ matrix.shard }}-${{ hashFiles('samples/**/pom.xml', '.github/maven-warm.sh') }}
          restore-keys: maven-${{ runner.os }}-cli-${{ matrix.shard }}-
      - run: .github/maven-warm.sh
        if: needs.changes.outputs.code == 'true'
      - run: ./gradlew :mutastic-cli:test -Pmutastic.shard=${{ matrix.shard }}/4
        if: needs.changes.outputs.code == 'true'
      # What was running when a test ran out of time (TimeoutDump), in the log as well as the
      # reports.
      - name: what a test that timed out was waiting on
        if: always() && needs.changes.outputs.code == 'true'
        run: bash .github/timeout-dumps.sh
      # Without what this build published, which each run publishes again, or Maven's records of
      # what it couldn't fetch.
      - if: github.ref == 'refs/heads/main' && steps.maven.outputs.cache-hit != 'true' && needs.changes.outputs.code == 'true'
        run: |
          rm -rf ~/.m2/repository/io/mutastic build/samples-maven-local/io/mutastic
          find ~/.m2/repository build/samples-maven-local \( -name '*.lastUpdated' -o -name 'resolver-status.properties' \) -delete || true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.maven.outputs.cache-hit != 'true' && needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.m2/repository
            build/samples-maven-local
          key: ${{ steps.maven.outputs.cache-primary-key }}
      # These tests build a copy of a sample project, and each copy is a new directory, so Gradle
      # forks a javac worker for it rather than reusing the identical one it forked for the copy
      # before. A worker belongs to the daemon that forked it and outlives the build with it, for
      # the three hours a daemon waits by default: a full build left 118 of them idle, and a few
      # builds left hundreds, gigabytes of them, which starved everything else on the machine. The
      # samples' builds now share a daemon that goes twenty seconds after they stop using it
      # (mutastic-cli's build file), which takes its workers with it.
      #
      # A worker the samples left looks exactly like one this build forked for mutastic's own JDK
      # 17 modules, and the daemons that own them can stand in for each other, so neither the
      # command line nor the parent says whose a worker is. What the tests left is the difference
      # instead: the test task records how many were running as it began, with everything it
      # depends on built and no test started, and the rest is what the tests themselves left. That
      # is nothing once the samples' daemon has gone, whatever each shard had to compile, where
      # unbounded it is scores of them. Four is slack for a worker forked late.
      #
      # A daemon takes a moment to go and the samples' waits for its timeout, so the difference is
      # given a minute to settle. The pattern is written `Mai[n]`, and the processes filtered to
      # those running a JVM, so this step's own command line isn't counted as one of them. Not
      # when the run is cancelled: no one reads it, and the minute holds up the run replacing it.
      - name: the sample builds left nothing running
        if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
        run: |
          before=mutastic-cli/build/gradle-workers-before.txt
          if [ ! -f $before ]; then
            echo "The tests never started, so there is no count to compare. Nothing to say here."
            exit 0
          fi
          started=$(cat $before)
          for attempt in $(seq 1 13); do
            ps -eo pid=,ppid=,args= | grep 'bin/java' > processes.txt || true
            running=$(grep -c 'process\.internal\.worker\.GradleWorkerMai[n]' processes.txt || true)
            left=$((running - started))
            if [ "$left" -le 4 ]; then break; fi
            sleep 5
          done
          echo "Workers: $started when the tests began, $running now, so the tests left $left."
          if [ "$left" -gt 4 ]; then
            echo "The samples' builds left $left workers running a minute after the tests:"
            awk '/process\.internal\.worker\.GradleWorkerMai[n]/ { print "  " $1 " (daemon " $2 ")" }' processes.txt
            exit 1
          fi
          echo "The samples' builds left nothing running."
      # What the tests measured, in their JVM and outside it (the worker, Maven, Gradle).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.code == 'true'
        with:
          name: coverage-cli-${{ matrix.shard }}
          path: mutastic-cli/build/jacoco/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: reports-cli-${{ matrix.shard }}-${{ github.run_attempt }}
          path: mutastic-cli/build/reports/

  # Windows, on its own beside the others: the CLI's end-to-end tests on a few samples (the cards,
  # a Gradle build and a Maven build), run the way a Windows user runs them, with `gradlew.bat`.
  # The rest of the build is the same on every platform, so it runs on Linux only.
  # Windows, in two shares to stay well under the time limit (windows-share.yml has what each
  # runs).
  windows-share:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2]
    uses: ./.github/workflows/windows-share.yml
    with:
      share: ${{ matrix.share }}

  # About one Windows share in ten loses its runner: it stops answering until the job's time is
  # up, or can no longer start java.exe or node.exe (0xC0000142), and every step after fails. The
  # change under test did neither, and in the merge queue either one put its pull request out.
  # So when a share didn't pass, this says which shares' runners broke, and those run once more on
  # a new machine. A share whose tests failed isn't run again: that failure is the change's.
  windows-faults:
    needs: [changes, windows-share]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.windows-share.result != 'success' && needs.windows-share.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      again: ${{ steps.faults.outputs.again }}
      tests-failed: ${{ steps.faults.outputs.tests-failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: faults
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/windows-faults.sh "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  windows-again:
    needs: [changes, windows-faults]
    if: ${{ !cancelled() && needs.windows-faults.result == 'success' && needs.windows-faults.outputs.again != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        share: ${{ fromJSON(needs.windows-faults.outputs.again) }}
    uses: ./.github/workflows/windows-share.yml
    with:
      share: ${{ matrix.share }}
      again: true

  # The check branch protection names: passes when both Windows shares do, or when they were
  # skipped because nothing the build reads changed. A share that didn't pass is made up for only
  # when its runner broke and its second run passed, and no share's tests failed. If `changes`
  # itself failed, every job after it was skipped, so this fails: a skip passes only when
  # `changes` said so. A cancelled run skips it, rather than wait for a runner to fail it while
  # the run replacing it waits.
  windows:
    needs: [changes, windows-share, windows-faults, windows-again]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SHARES: ${{ needs.windows-share.result }}
          TESTS_FAILED: ${{ needs.windows-faults.outputs.tests-failed }}
          AGAIN: ${{ needs.windows-again.result }}
        run: |
          test "$CHANGES" = success
          test "$SHARES" = success \
            || { test "$SHARES" = skipped && test "$CODE" = false; } \
            || { test "$TESTS_FAILED" = false && test "$AGAIN" = success; }

  # The HTML report page both editions embed (report-ui/): report.html is the build of its sources,
  # and renders each view, in Chrome (the runner's own), from reports written to test it.
  report-ui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node report-ui/build.mjs --check
      - run: node --test report-ui/test/*.test.mjs

  # The coverage floor, over what every job measured.
  coverage:
    needs: [changes, build, cli]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-cli-*
          path: shards
      # Each share's files, named apart, where the coverage tasks read the CLI's.
      - run: |
          outside=mutastic-cli/build/jacoco/outside
          mkdir -p "$outside"
          for shard in shards/*; do
            name=$(basename "$shard")
            cp "$shard/test.exec" "$outside/$name-test.exec"
            for file in "$shard"/outside/*.exec; do
              cp "$file" "$outside/$name-$(basename "$file")"
            done
          done
      - run: ./gradlew coverageReport coverageCheck -x test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-coverage-${{ github.run_attempt }}
          path: build/reports/
