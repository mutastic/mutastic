# The Gradle plugin to the Gradle Plugin Portal, for a release already published on Maven Central:
# started by hand on the release's tag (`gh workflow run portal.yml --ref v0.2.0`) once the Central
# Portal shows it published, since the plugin's own dependency, the `mutastic` command, comes from
# Central. Run on the tag, as the `release` environment only lets tags deploy. The portal reviews a plugin's first version by hand
# before it's listed. RELEASING.md has the steps.
#
# Secrets live in the `release` environment, so its required reviewer approves this too. Actions
# are pinned to a commit: a tag can be moved.
name: Gradle Plugin Portal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: The version, from the tag it runs on
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "run it on a release's tag (--ref vX.Y.Z), not $TAG"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      # The plugin depends on the `mutastic` command of its own version: it must be on Central.
      - name: The release is on Maven Central
        run: |
          url="https://repo1.maven.org/maven2/io/mutastic/mutastic-cli/$VERSION/mutastic-cli-$VERSION.pom"
          curl -sfI "$url" > /dev/null || { echo "$VERSION isn't on Maven Central yet: publish it there first"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Publish to the Gradle Plugin Portal
        run: ./gradlew :mutastic-gradle-plugin:publishPlugins -PreleaseVersion="$VERSION"
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
