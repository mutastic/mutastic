# The docs site, docs.mutastic.io: built on every change to it, and deployed to Cloudflare Pages
# from main, with a preview for each pull request, once the Cloudflare secrets are set (see
# docs/README.md). The Java build checks the rest: that the reference's commands.json matches the
# CLI's declarations, and that every command the docs show parses.
# Actions are pinned to a commit: a tag can be moved.
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      # Main is docs.mutastic.io; a pull request's branch gets a preview address of its own.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npx --yes wrangler@4.151.1 pages deploy dist --project-name=mutastic-docs --branch="$BRANCH"
