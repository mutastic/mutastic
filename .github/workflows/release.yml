# A release, when one is published on GitHub with a tag like v0.1.0: the full build, then every
# library signed and uploaded to Maven Central, and the CLI's distribution attached to the release.
# The upload isn't published: that's done by hand from the Central Portal, where until then it can
# be dropped. Once published, a version can never be changed or removed. RELEASING.md has the steps.
#
# Secrets live in the `release` environment, so a required reviewer can stand between a tag and
# Central. Actions are pinned to a commit: a tag can be moved.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # to attach the distribution to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: The version, from the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG isn't vX.Y.Z"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      # Unsigned uploads are refused by Central, but only after the upload: say so first.
      - name: Every secret is set
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_KEY_ID SIGNING_KEY_PASSWORD GRADLE_PUBLISH_KEY GRADLE_PUBLISH_SECRET; do
            [[ -n "${!name}" ]] || { echo "the release environment has no $name secret"; exit 1; }
          done
      - run: ./gradlew build -PreleaseVersion="$VERSION"
      # The Gradle Plugin Portal's own checks, before anything is uploaded anywhere: the portal
      # publish itself waits for Central (portal.yml), since the plugin's jars come from there.
      - name: Check the Gradle plugin for the portal
        run: ./gradlew :mutastic-gradle-plugin:publishPlugins --validate-only -PreleaseVersion="$VERSION"
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      - name: Upload to Maven Central
        run: ./gradlew publishToMavenCentral -PreleaseVersion="$VERSION"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # With their checksums, which the native mutastic (mutastic-rs) checks the download against
      # when it fetches the Java edition.
      - name: Attach the CLI to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ./gradlew :mutastic-cli:distZip :mutastic-cli:distTar -PreleaseVersion="$VERSION"
          cd mutastic-cli/build/distributions
          sha256sum mutastic-"$VERSION".zip mutastic-"$VERSION".tar > SHA256SUMS
          gh release upload "$TAG" mutastic-"$VERSION".{zip,tar} SHA256SUMS
