# A release, when one is published on GitHub with a tag like v0.1.0: every library signed and
# uploaded to Maven Central, and the CLI's distribution and the SBOM attached to the release, each
# attested as built here, at the tag. The upload isn't published: that's done by hand from the
# Central Portal, where until then it can be dropped. Once published, a version can never be
# changed or removed. RELEASING.md has the steps.
#
# The tests aren't run again here. The merge queue ran them on this very tree, in parallel jobs,
# before it landed on main; run whole on one runner they took 25 minutes for 1.0.0 and 52 for
# 1.3.1, against a 60-minute limit. So only a commit main has and CI passed is released, and the
# job builds what ships and runs the checks only a release can.
#
# Secrets live in the `release` environment, so a required reviewer can stand between a tag and
# Central. Actions are pinned to a commit: a tag can be moved.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Before anyone is asked to approve: the tag's commit is on main, and CI passed on it, in the
  # merge queue or on the push to main. Otherwise it says which run is missing or red.
  tested:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # to compare the commit with main
      actions: read # to read CI's runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - name: CI passed on the tag's commit, on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/release-tested.sh "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)"

  release:
    needs: tested
    runs-on: ubuntu-latest
    # 52 minutes for 1.3.1, when it ran the whole build; without the tests, about 5.
    timeout-minutes: 20
    environment: release
    # The job with the publishing secrets writes nothing to the repository: `attach` does that.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: The version, from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG isn't vX.Y.Z"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      # The notes are the release's section of CHANGELOG.md (RELEASING.md makes them with the same
      # command). A tag with no section stops here, before anything is uploaded; `attach` gives
      # them to a release created without notes.
      - name: The notes, from CHANGELOG.md
        run: |
          mkdir -p "$RUNNER_TEMP/release/assets"
          sh scripts/changelog.sh notes "$VERSION" > "$RUNNER_TEMP/release/notes.md"
      # Unsigned uploads are refused by Central, but only after the upload: say so first.
      - name: Every secret is set
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_KEY_ID SIGNING_KEY_PASSWORD GRADLE_PUBLISH_KEY GRADLE_PUBLISH_SECRET; do
            [[ -n "${!name}" ]] || { echo "the release environment has no $name secret"; exit 1; }
          done
      # What ships, built as it will be uploaded, so a broken javadoc stops it before anything
      # leaves; and the plugin API compared with the last release's jar, from Central, which the
      # merge queue's build compared too but a release must not skip. Every module's dependencies
      # come from gradle.lockfile, as in CI, through the same wrapper.
      - name: Build what ships
        run: ./gradlew assemble javadoc checkApiCompatibility -PreleaseVersion="$VERSION"
      # Its ids all kept, and its files within Central's budget (RELEASING.md step 1). CI ran these
      # in the merge queue for a "chore(release)" commit; a tag on any other commit gets them here.
      - name: The ids, and the files on Central
        run: sh scripts/release-check.sh --build "$VERSION"
      # The Gradle Plugin Portal's own checks, before anything is uploaded anywhere: the portal
      # publish itself waits for Central (portal.yml), since the plugin's jars come from there.
      - name: Check the Gradle plugin for the portal
        run: ./gradlew :mutastic-gradle-plugin:publishPlugins --validate-only -PreleaseVersion="$VERSION"
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      - name: Upload to Maven Central
        run: ./gradlew publishToMavenCentral -PreleaseVersion="$VERSION"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # The CLI's distribution, with its checksums, which the native mutastic (mutastic-rs) checks
      # the download against when it fetches the Java edition; and what the release is made of, as
      # a CycloneDX SBOM. The SBOM goes to the GitHub release only: Central counts every file
      # against its monthly limit (checkCentralFiles).
      - name: The CLI, its checksums and the SBOM
        run: |
          ./gradlew :mutastic-cli:distZip :mutastic-cli:distTar cyclonedxBom -PreleaseVersion="$VERSION"
          assets=$RUNNER_TEMP/release/assets
          cp mutastic-cli/build/distributions/mutastic-"$VERSION".{zip,tar} "$assets"
          cp build/reports/cyclonedx/bom.json "$assets/mutastic-$VERSION.cdx.json"
          cd "$assets"
          sha256sum mutastic-"$VERSION".zip mutastic-"$VERSION".tar > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

  # The assets attested and attached to the release, and the notes given to one created without.
  # GitHub's signed record of where each asset was built, this workflow at the tag's commit, lets a
  # download be checked against more than a SHA256SUMS made beside it (`gh attestation verify`,
  # RELEASING.md's *Checking a download*): the archives SHA256SUMS lists, SHA256SUMS itself and
  # the SBOM, and the SBOM as what the archives are made of. No secrets here, and no build.
  attach:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to attach the assets, and the notes, to the release
      id-token: write # to sign the attestations
      attestations: write # to keep them in the repository
    # Nothing is checked out: the workspace holds only what the release job built.
    env:
      ASSETS: release/assets
      SBOM: release/assets/mutastic-${{ needs.release.outputs.version }}.cdx.json
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Attest the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ env.ASSETS }}/SHA256SUMS
      - name: Attest SHA256SUMS and the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.ASSETS }}/SHA256SUMS
            ${{ env.SBOM }}
      - name: Attest the SBOM, for the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ env.ASSETS }}/SHA256SUMS
          sbom-path: ${{ env.SBOM }}
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$ASSETS"/*
          if [[ -z "${BODY//[[:space:]]/}" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release/notes.md
          fi
