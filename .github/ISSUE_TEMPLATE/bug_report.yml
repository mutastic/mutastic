name: Bug report
description: mutastic did something wrong, or something it shouldn't.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what it printed, and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mutastic version
      description: "`mutastic --version`, or the plugin's version"
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: runner
    attributes:
      label: How you ran it
      options:
        - Gradle plugin
        - Maven plugin
        - Command line
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: JDK and build tool
      description: The JDK mutastic and your tests ran on, and your Gradle or Maven version.
      placeholder: "JDK 25 for mutastic, 17 for the tests; Gradle 9.2.1"
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The command and its output. `--format=agent` is the most compact to paste.
      render: text
  - type: textarea
    id: reproduce
    attributes:
      label: A project that shows it
      description: A link to a small project, or the code and test, if you can share one.
