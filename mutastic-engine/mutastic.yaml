# mutastic on its own engine, as the Nightly runs it. The build and CI still run every test.
#
# CardLinesTest checks how reports map a mutant's lines, over every truth fixture under every
# operator. The engine's scanning code reaches it only on the way, and it cost about 38% of the
# engine shares' test time. Of the 1235 mutants it caught on 26 Nov, it was the only test to catch
# one (mda36ff17), which ExceptionTruthTest#aThrowALocalGuardsIsCounted now catches too.
exclude-tests:
  - test: io.mutastic.engine.CardLinesTest
    reason: checks how reports map lines, reached by scan code only on the way, about 38% of the engine shares' test time
