# mutastic's own swaps between similar methods of the JDK: call rules, in the same shape as a
# plugin's rules file. `descriptors` says which overloads: `indexOf(String, int, int)` has no
# `lastIndexOf` to become, and calling one that doesn't exist would look like a catch. A search
# with a starting point isn't swapped: it searches a different part of the text, and which inputs
# show that isn't something a line of help can say.

- id: library/swap-string
  explanation: A `String` method becomes the similar one, `startsWith` and `endsWith`, `toUpperCase` and `toLowerCase`, `stripLeading` and `stripTrailing`. It goes unnoticed when no test has text where the two differ.
  owners: java.lang.String
  methods: startsWith, endsWith, toUpperCase, toLowerCase, stripLeading, stripTrailing
  descriptors: (Ljava/lang/String;)Z, ()Ljava/lang/String;, (Ljava/util/Locale;)Ljava/lang/String;
  rewrite: rename startsWith->endsWith, endsWith->startsWith, toUpperCase->toLowerCase, toLowerCase->toUpperCase, stripLeading->stripTrailing, stripTrailing->stripLeading
  changed: "{name} changed to {to}"
  headline: no test tells `{name}` from `{to}` in {method}
  help: use text where they differ, and assert the result
  help.startsWith: use text with it at one end and not the other, and assert the result
  help.endsWith: use text with it at one end and not the other, and assert the result
  help.toUpperCase: use text with letters in it, and assert the case of the result
  help.toLowerCase: use text with letters in it, and assert the case of the result
  help.stripLeading: use text with a space at one end and not the other, and assert the result
  help.stripTrailing: use text with a space at one end and not the other, and assert the result

# In stronger: measured on mutastic's own code (6 Nov 2026), about 80% of what it left were searches
# for something the text has only once by its format, a descriptor's `(`.
- id: library/swap-index-of
  explanation: `String.indexOf` and `lastIndexOf` swap places. It goes unnoticed when no test has text with what's searched for in it twice.
  tier: stronger
  owners: java.lang.String
  methods: indexOf, lastIndexOf
  descriptors: (I)I, (Ljava/lang/String;)I
  rewrite: rename indexOf->lastIndexOf, lastIndexOf->indexOf
  changed: "{name} changed to {to}"
  headline: no test tells `{name}` from `{to}` in {method}
  help: use text with what's searched for in it twice, and assert which one is found

- id: library/swap-math
  explanation: `Math.min` and `Math.max` swap places, and so do `Math.floor` and `Math.ceil`. It goes unnoticed when no test has values where the two differ.
  owners: java.lang.Math
  methods: min, max, floor, ceil
  rewrite: rename min->max, max->min, floor->ceil, ceil->floor
  changed: "{name} changed to {to}"
  headline: no test tells `{name}` from `{to}` in {method}
  help: use values where they differ, and assert the result
  help.min: use two different values, and assert which comes back
  help.max: use two different values, and assert which comes back
  help.floor: use a value with a fraction, and assert which way it's rounded
  help.ceil: use a value with a fraction, and assert which way it's rounded

# Only overloads whose result shows the argument: a charset, a locale or a `split` limit rarely does.
- id: library/omit-argument
  explanation: A call to one of the JDK's overloads leaves out its last argument and calls the shorter one, `indexOf(x, from)` to `indexOf(x)`, `substring(from, to)` to `substring(from)`, `parseInt(text, 16)` to `parseInt(text)`. It goes unnoticed when no test has a value that argument makes a difference to.
  tier: stronger
  owners: java.lang.String, java.lang.StringBuilder, java.lang.Integer, java.lang.Long, java.util.regex.Pattern, java.util.Objects
  methods: indexOf, lastIndexOf, substring, parseInt, parseLong, toString, compile
  descriptors: (Ljava/lang/String;I)I, (II)I, (II)Ljava/lang/String;, (Ljava/lang/String;I)J, (JI)Ljava/lang/String;, (Ljava/lang/String;I)Ljava/util/regex/Pattern;, (Ljava/lang/Object;Ljava/lang/String;)Ljava/lang/String;
  rewrite: omit last argument
  changed: called without its last argument
  headline: no test needs the last argument of `{name}` in {method}
  help: use a value that argument makes a difference to, and assert the result

# A method that exists to throw on overflow, as the plain operation: the bug of not having used it.
- id: library/unchecked-arithmetic
  explanation: `Math.addExact` and the like become the plain operation, which overflows instead of throwing. It goes unnoticed when no test has a result too big for its type.
  tier: stronger
  owners: java.lang.Math, java.lang.StrictMath
  methods: addExact, subtractExact, multiplyExact, incrementExact, decrementExact, negateExact, toIntExact
  descriptors: (II)I, (JJ)J, (JI)J, (I)I, (J)J, (J)I
  rewrite: unchecked arithmetic
  changed: no longer throws on overflow
  headline: no test makes `{name}` overflow in {method}
  help: add a test whose result doesn't fit its type, and assert it throws `ArithmeticException`
